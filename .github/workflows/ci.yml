name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/build.py
      - run: python scripts/smoke.py dist/portable/JACK-GUARD/JACK-GUARD.exe
      - run: python scripts/smoke.py dist/JACK-GUARD.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JACK-GUARD-windows
          path: |
            dist/JACK-GUARD.exe
            dist/JACK-GUARD-portable.zip
            dist/SHA256SUMS.txt
            test-results.xml
          if-no-files-found: error
          retention-days: 14
