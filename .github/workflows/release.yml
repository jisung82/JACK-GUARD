name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Verify approved license and release version
        shell: pwsh
        run: |
          if (Select-String -Path LICENSE -Pattern 'PENDING OWNER APPROVAL' -Quiet) {
            throw 'Choose the project license before publishing.'
          }
          $version = python -c "from jack_guard import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Version/tag mismatch' }
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/build.py
      - run: python scripts/smoke.py dist/portable/JACK-GUARD/JACK-GUARD.exe
      - run: python scripts/smoke.py dist/JACK-GUARD.exe
      - name: Publish verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "JACK GUARD $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md dist/JACK-GUARD.exe dist/JACK-GUARD-portable.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
