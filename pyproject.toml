[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jack-guard"
version = "0.2.0"
description = "Local Windows privacy companion"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials==6.10.2", "psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.0", "pyinstaller==6.19.0", "Pillow==12.1.0"]

[project.scripts]
jack-guard = "jack_guard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
